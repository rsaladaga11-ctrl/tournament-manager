{% extends "base.html" %}
{% block title %}Create account · Tournament Manager{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Create the Admin account</h1>
  <p class="muted">First-time setup. This account creates and runs tournaments.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" required minlength="3" autofocus></label>
    <label>Display name <input name="display_name"></label>
    <label>Password <input name="password" type="password" required minlength="4"></label>
    <button class="btn btn-primary btn-block">Create account</button>
  </form>
</div>
{% endblock %}
