{% extends "base.html" %}
{% block title %}Create account · Tournament Manager{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" required minlength="3" autofocus></label>
    <label>Display name <span class="muted">(shown in pairings)</span><input name="display_name"></label>
    <label>Password <input name="password" type="password" required minlength="4"></label>
    <button class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="muted center">Already have one? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
