{% extends "base.html" %}
{% block title %}Log in · Tournament Manager{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Log in</h1>
  {% if no_users %}<p class="note">No accounts yet. <a href="{{ url_for('register') }}">Create the first account</a> — it becomes the Admin / Tournament Coordinator.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username <input name="username" required autofocus></label>
    <label>Password <input name="password" type="password" required></label>
    <button class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted center">New player? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
