{% extends "base.html" %}
{% block content %}
<div class="auth-card card">
  <h1>My account</h1>
  <p class="muted">Username: <strong>{{ me.username }}</strong></p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Display name <input name="display_name" value="{{ me.display_name }}"></label>
    <label>New password <span class="muted">(leave blank to keep)</span><input name="new_password" type="password"></label>
    <label>Current password <input name="password" type="password" required></label>
    <button class="btn btn-primary btn-block">Save</button>
  </form>
</div>
{% endblock %}
